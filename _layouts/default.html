<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  {% if page.favicon %}
    <link rel="icon" href="{{ page.favicon | relative_url }}" type="image/png">
  {% else %}
    <link rel="icon" href="{{ '/images/icons/ZoopaLogo.ico' | relative_url }}" type="image/x-icon">
  {% endif %}
  <link href="https://fonts.google.com/specimen/Lato" rel="stylesheet">
  <title>{{ page.title }} | {{ site.title }}</title>
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
